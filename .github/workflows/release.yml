# Builds the Attic Hub installer when a version tag is pushed (v0.12.1, matching desktop/package.json),
# and uploads it with latest.yml to a DRAFT GitHub Release. Press "Publish release" on GitHub
# (github.com/sankethhegde/attic/releases): every installed Attic Hub then finds it, downloads it and
# installs it the next time it starts or quits, like PixHaven.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write    # the draft release upload

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Electron binary (npm 11 skips install scripts by default)
        working-directory: desktop
        run: node node_modules/electron/install.js
      - name: The tag matches the version in desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="v$(node -p "require('./desktop/package.json').version")"
          if [ "$V" != "$GITHUB_REF_NAME" ]; then echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($V)"; exit 1; fi
      - name: Unit tests (agent)
        shell: bash
        run: |
          node --test "agent/*.test.js" > test.log 2>&1 && exit 0
          cat test.log
          MSG=$(grep -E "✖|not ok|AssertionError|Error:" test.log | head -60 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Agent tests failed::$MSG"
          exit 1
      # The server's tests are the HP's (they run there before each server release). Some depend on network
      # timing GitHub's runners don't match, so here a failure is reported as a warning, not a stop.
      - name: Unit tests (server, reported only)
        shell: bash
        continue-on-error: true
        run: |
          node --test "server/*.test.js" > server.log 2>&1 && exit 0
          MSG=$(grep -E "^✖" server.log | head -20 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::warning title=Server tests failed on the runner::$MSG"
          exit 1
      # One draft per tag: made here first, so electron-builder's parallel uploads all find it, rather than
      # each making its own (v0.12.2 came out as two drafts, the installer in one and the .blockmap in the other).
      - name: Make the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" --notes "Attic Hub ${GITHUB_REF_NAME#v}. Press Publish release: every installed Attic Hub then updates itself."
      - name: Build the installer and upload a draft release
        working-directory: desktop
        run: npx electron-builder --win nsis --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: attic-hub-installer
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          if-no-files-found: ignore
